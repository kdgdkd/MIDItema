[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "miditema"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    # Install midicore in editable mode: pip install -e ../
    "midicore",
]

[project.scripts]
miditema = "miditema:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
